services:
  postgres:
    ports: !override ["127.0.0.1:15432:5432"]
  localstack:
    ports: !override ["127.0.0.1:14566:4566"]
  keycloak:
    ports: !override ["127.0.0.1:18081:8080"]
    environment:
      KC_HOSTNAME: http://localhost:18081
  gateway:
    ports: !override ["127.0.0.1:18080:8080"]
  app:
    environment:
      OIDC_ISSUER: http://localhost:18081/realms/wagering
