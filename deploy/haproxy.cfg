global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    retries 0

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 2s
    hold obsolete 2s

frontend public
    bind :8080
    default_backend application

backend application
    balance roundrobin
    http-response set-header X-Wagering-Instance %[srv_name]
    option httpchk GET /health/ready
    http-check expect status 200
    # Compose returns one A record per replica; refresh after scale/replacement.
    server-template app 32 app:8080 check inter 2s fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr none
