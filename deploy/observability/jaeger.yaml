# Local collector, storage and trace UI in one process. Memory is intentionally bounded.
extensions:
  jaeger_storage:
    backends:
      local:
        memory:
          max_traces: 10000
  jaeger_query:
    storage:
      traces: local
    http:
      endpoint: 0.0.0.0:16686
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    timeout: 1s
    send_batch_size: 256
exporters:
  jaeger_storage_exporter:
    trace_storage: local
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
