services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a private env file first}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Generate a private env file first}
      POSTGRES_DB: wagering
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./deploy/postgres/roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U wagering
      interval: 3s
      timeout: 3s
      retries: 20
  # Nome preservado para compatibilidade; o emulador é MiniStack com IAM ativo.
  localstack:
    image: ministackorg/ministack:1.5.17@sha256:11d7308bfc75029d55625b9525e84a2401431ed1ff2148c6311800ff5009ae9c
    environment:
      AUTH: 'true'
      AWS_DEFAULT_REGION: us-east-1
      PERSIST_STATE: '1'
      STATE_DIR: /var/lib/ministack
    ports:
    - 127.0.0.1:4566:4566
    volumes:
    - ./deploy/localstack/init:/etc/localstack/init/ready.d:ro
    - awscredentials:/credentials
    - ministackdata:/var/lib/ministack
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /credentials/ready
      interval: 3s
      timeout: 5s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
    - start-dev
    - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Generate a private env file first}
      TEST_PROVIDER_A_CLIENT_SECRET: ${TEST_PROVIDER_A_CLIENT_SECRET:?Missing client secret}
      TEST_PROVIDER_B_CLIENT_SECRET: ${TEST_PROVIDER_B_CLIENT_SECRET:?Missing client secret}
      TEST_INTERNAL_CLIENT_SECRET: ${TEST_INTERNAL_CLIENT_SECRET:?Missing client secret}
      TEST_EXPIRED_CLIENT_SECRET: ${TEST_EXPIRED_CLIENT_SECRET:?Missing client secret}
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME: http://localhost:8081
    ports:
    - 127.0.0.1:8081:8080
    healthcheck:
      test:
      - CMD-SHELL
      - 'bash -c ''exec 3<>/dev/tcp/localhost/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n"
        >&3; read -r response <&3; [[ "$$response" == *200* ]]'' '
      interval: 5s
      timeout: 5s
      retries: 40
    volumes:
    - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
  migrate:
    image: migrate/migrate:v4.17.1
    entrypoint: ["/bin/sh", "/schema-migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
    - ./migrations:/migrations:ro
    - ./scripts/schema-migrate.sh:/schema-migrate.sh:ro
    environment:
      MIGRATION_DATABASE_URL: postgres://wagering:${POSTGRES_PASSWORD:?Missing database password}@postgres:5432/wagering?sslmode=disable
    command: [up]
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: [observability]
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
    - ./deploy/observability/jaeger.yaml:/etc/jaeger/config.yaml:ro
    ports:
    - 127.0.0.1:16686:16686
    - 127.0.0.1:4318:4318
  prometheus:
    image: prom/prometheus:v3.13.3
    profiles: [observability]
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.retention.time=7d
    volumes:
    - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    - prometheusdata:/prometheus
    ports:
    - 127.0.0.1:9090:9090
  gateway:
    build:
      context: .
      target: gateway
    depends_on:
      app:
        condition: service_healthy
    ports:
    - 127.0.0.1:8080:8080
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 3s
      timeout: 6s
      retries: 20
      start_period: 10s
  app:
    stop_grace_period: 35s
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file: .env
    environment:
      HTTP_ADDR: :8080
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-wagering}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      METRICS_ADDR: :9090
      DATABASE_URL: postgres://wagering_app:${POSTGRES_APP_PASSWORD:?Missing app password}@postgres:5432/wagering?sslmode=disable
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_PROFILE: worker
      AWS_SHARED_CREDENTIALS_FILE: /credentials/config
      WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SETTLEMENT_QUEUE_URL: http://localstack:4566/000000000000/wager-settlements.fifo
      EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      OIDC_ISSUER: http://localhost:8081/realms/wagering
      OIDC_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
    volumes:
    - awscredentials:/credentials:ro
    expose: ["8080", "9090"]
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 3s
      timeout: 6s
      retries: 20
      start_period: 20s
    deploy:
      replicas: 1
volumes:
  prometheusdata: null
  pgdata: null
  awscredentials: null
  ministackdata: null
